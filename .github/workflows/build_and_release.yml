on:
  push:
    paths:
      - 'version.txt'
      - 'launcher_version.txt'
    branches:
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build request'

jobs:
  build-executables:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: AutoMonster
            script: main.py
          - name: LauncherAutoMonster
            script: launcher.py
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          .\install_dependencies.bat
          python -m pip install pyinstaller

      - name: Build Executable
        run: |
          # Get the amscrcpy package location (it is vendored at the repo root) using Python
          $amscrcpyDir = python -c "import amscrcpy, os; print(os.path.dirname(amscrcpy.__file__))"

          Write-Host "amscrcpy directory: $amscrcpyDir"
          if (Test-Path "$amscrcpyDir\scrcpy-server-v4.1") {
            Write-Host "amscrcpy module and server jar found. Contents:"
            Get-ChildItem $amscrcpyDir | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Host "ERROR: amscrcpy directory or server jar not found at $amscrcpyDir"
            exit 1
          }

          # Build executable with the amscrcpy module (and its server jar) and changelog embedded
          $command = "pyinstaller --noconfirm --onefile --windowed --icon `"./assets/favicon.ico`" --add-data `"$amscrcpyDir;amscrcpy`" --add-data `"changelog.json;.`" ${{ matrix.script }} -n ${{ matrix.name }}"
          Write-Host "Running: $command"
          Invoke-Expression $command

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.exe

  create-release:
    needs: build-executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Delete all releases and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete all releases (published and drafts) by release ID.
          # NOTE: 'gh release delete' takes a TAG, not a release name. An
          # earlier version passed the release name and silently failed on
          # every build, which is how ~76 draft releases accumulated.
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          if ($releases) {
            foreach ($release in $releases) {
              Write-Host "Deleting release $($release.tag_name) (id $($release.id), draft $($release.draft))"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$($release.id)"
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Failed to delete release id $($release.id)"
                exit 1
              }
            }
          } else {
            Write-Host "No releases found to delete"
          }

          # Delete any remaining tags
          Write-Host "Cleaning up tags..."
          git fetch --prune --unshallow
          git tag | ForEach-Object {
            Write-Host "Deleting tag: $_"
            git push origin --delete $_ --force 2>$null
            git tag -d $_ 2>$null
          }

      - name: Reorganize files
        run: |
          New-Item -ItemType Directory -Force -Path final_dist
          Move-Item -Path "dist/AutoMonster/AutoMonster.exe" -Destination "final_dist/AutoMonster.exe" -Force
          Move-Item -Path "dist/LauncherAutoMonster/LauncherAutoMonster.exe" -Destination "final_dist/LauncherAutoMonster.exe" -Force
          Get-ChildItem final_dist

      - name: Install Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile "is.exe"
          .\is.exe /VERYSILENT /NORESTART /ALLUSERS

      - name: Build Installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - name: Rename artifacts for release
        run: |
          Move-Item -Path "final_dist/AutoMonster.exe" -Destination "final_dist/AutoMonster.bin" -Force
          Move-Item -Path "final_dist/LauncherAutoMonster.exe" -Destination "final_dist/Launcher.bin" -Force

      - name: Get version and build release notes
        id: get_version
        run: |
          $version = (Get-Content version.txt).Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT

          # Build the release body from changelog.json so the release page
          # shows the same "What's New" notes as the in-app popup.
          # Fail the build if the version has no changelog entry.
          $changelog = Get-Content changelog.json -Raw | ConvertFrom-Json
          $entry = $null
          foreach ($prop in $changelog.PSObject.Properties) {
              if ($prop.Name -eq $version) { $entry = $prop.Value; break }
          }
          if (-not $entry) {
              throw "No changelog entry for version $version in changelog.json. Add one before releasing."
          }

          $lines = @()
          $lines += "## What's New"
          $lines += ""
          $lines += "> $($entry.subtitle)"
          $lines += ""
          foreach ($change in $entry.changes) {
              $lines += "- $change"
          }
          $lines += ""
          $lines += "## Installation Instructions"
          $lines += "1. Download **AutoMonster_Setup.exe**"
          $lines += "2. Run the installer"
          $lines += "3. Launch AutoMonster"
          $lines += ""
          $lines += "> **Note:** Only download the Setup file. Other assets are used by the auto-updater."

          # Write without BOM so the release body starts cleanly
          [System.IO.File]::WriteAllText("release_body.md", ($lines -join "`n"), [System.Text.UTF8Encoding]::new($false))
          Get-Content release_body.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v-${{ steps.get_version.outputs.version }}
          name: Version ${{ steps.get_version.outputs.version }}
          body_path: release_body.md
          files: |
            ./installer/AutoMonster_Setup.exe
            ./final_dist/AutoMonster.bin
            ./final_dist/Launcher.bin
            ./launcher_version.txt